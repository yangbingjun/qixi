<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七夕 · 一场流星雨</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #2a2350 0%, #1a1440 45%, #0d0a28 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  /* ---------- 夜空 ---------- */
  .sky{position:fixed; inset:0; pointer-events:none; z-index:0;}
  .moon{
    position:absolute; top:8%; right:10%; width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff8e1, #ffe9a8 55%, #f7d774);
    box-shadow:0 0 40px 12px rgba(255,230,160,.35), 0 0 120px 40px rgba(255,220,150,.12);
  }
  .moon::after{
    content:''; position:absolute; inset:12px; border-radius:50%;
    background:radial-gradient(circle at 45% 45%, rgba(210,170,90,.25), transparent 60%);
  }
  .star{
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15; transform:scale(.8)}50%{opacity:1; transform:scale(1.15)}}
  .fall-heart{
    position:absolute; top:-8vh; opacity:.75;
    animation:fall linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,120,150,.5));
  }
  @keyframes fall{
    0%{transform:translateY(-8vh) rotate(0deg); opacity:0}
    8%{opacity:.8}
    100%{transform:translateY(112vh) rotate(340deg); opacity:0}
  }
  /* ---------- 开场流星雨 ---------- */
  .intro{
    position:fixed; inset:0; z-index:7; pointer-events:none; overflow:hidden;
    opacity:1; transition:opacity 1.1s ease;
  }
  .intro.fade{opacity:0;}
  .meteor{
    --ang:35deg;
    position:absolute; top:0; left:-10vw; height:3px; border-radius:99px;
    background:linear-gradient(90deg,#fff 0%, #ffe6b0 22%, #ff9a5c 48%, #ff5e3a 70%, transparent 100%);
    transform:rotate(var(--ang));
    animation:shoot 1.2s ease-out forwards;
    opacity:0;
  }
  .meteor::before{
    content:''; position:absolute; left:-4px; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle,#fff 30%, #ffd9a0 60%, rgba(255,140,60,.5) 100%);
    box-shadow:0 0 14px 5px rgba(255,180,90,.75), 0 0 34px 14px rgba(255,120,50,.35);
  }
  @keyframes shoot{
    0%{transform:rotate(var(--ang)) translateX(0); opacity:0;}
    10%{opacity:1;}
    100%{transform:rotate(var(--ang)) translateX(135vw); opacity:0;}
  }
  /* 主内容开场淡入 */
  .title, .stage{opacity:0; transition:opacity 1.3s ease;}
  body.ready .title, body.ready .stage{opacity:1;}
  /* ---------- 标题 ---------- */
  .title{
    position:relative; z-index:2; margin-bottom:4vh;
    color:#f3d9a4; letter-spacing:.6em; text-indent:.6em;
    font-size:clamp(18px,4vw,26px); font-weight:300;
    text-shadow:0 0 18px rgba(255,210,140,.45);
  }
  .title::before,.title::after{
    content:''; display:inline-block; width:clamp(40px,10vw,90px); height:1px;
    background:linear-gradient(90deg,transparent,rgba(243,217,164,.6));
    vertical-align:middle; margin:0 14px;
  }
  .title::after{background:linear-gradient(90deg,rgba(243,217,164,.6),transparent);}
  /* ---------- 舞台 ---------- */
  .stage{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
  }
  .envelope{
    position:relative;
    width:min(360px,84vw); height:min(240px,58vw);
    perspective:1400px;
    transition:opacity .7s ease, transform .7s ease;
  }
  .envelope.gone{opacity:0; transform:translateY(-30px) scale(.86); pointer-events:none;}
  /* 照片（信纸） */
  .photo{
    position:fixed; z-index:6; pointer-events:none;
    transform:translate(-50%,-50%) scale(.55);
    opacity:0;
    transition:left 1.3s cubic-bezier(.18,.72,.26,1), top 1.3s cubic-bezier(.18,.72,.26,1), transform 1.3s cubic-bezier(.18,.72,.26,1), opacity .45s ease;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));
  }
  .photo img{
    display:block; max-width:min(86vw,430px); max-height:76vh; width:auto;
    border-radius:8px; border:6px solid #fdf6ea; outline:1px solid rgba(210,180,130,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.55);
  }
  .photo.show{
    left:50% !important; top:50% !important;
    transform:translate(-50%,-52%) scale(1);
    opacity:1; pointer-events:auto;
  }
  .photo.show img{animation:photoGlow 3s ease-in-out infinite;}
  @keyframes photoGlow{
    0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.55), 0 0 30px rgba(255,170,190,.25);}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 24px 60px rgba(0,0,0,.55), 0 0 70px rgba(255,150,180,.5);}
  }
  /* 信封主体 */
  .env-body{
    position:absolute; inset:0; z-index:2; border-radius:8px;
    background:linear-gradient(160deg,#f7ead2 0%, #eed9b4 55%, #e2c89c 100%);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -10px 24px rgba(160,120,70,.18);
  }
  .env-body::after{
    content:''; position:absolute; left:50%; top:8px; bottom:8px; width:1px;
    background:linear-gradient(180deg,transparent,rgba(180,140,90,.25),transparent);
  }
  /* 左右折翼 */
  .env-side{
    position:absolute; top:0; bottom:0; width:46%; z-index:2;
    background:linear-gradient(160deg,#f0dcba,#e4c99e);
  }
  .env-side.left{left:0; clip-path:polygon(0 0,100% 0,0 100%); border-radius:8px 0 0 8px;}
  .env-side.right{right:0; clip-path:polygon(0 0,100% 0,100% 100%); border-radius:0 8px 8px 0;}
  /* 封口 flap */
  .flap{
    position:absolute; top:0; left:0; right:0; height:54%; z-index:3;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(180deg,#f9efdb 0%, #eed9b4 80%, #e0c493 100%);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform 1.1s cubic-bezier(.65,.05,.36,1);
    backface-visibility:hidden;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));
  }
  .flap.open{transform:rotateX(180deg); z-index:0;}
  /* 蝴蝶结 */
  .bow{
    position:absolute; top:27%; left:50%; z-index:5;
    width:76px; height:40px; margin-left:-38px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
  }
  .bow-l,.bow-r{
    position:absolute; top:5px; width:35px; height:26px;
    background:linear-gradient(135deg,#f7b7c9 0%, #e87395 70%, #d75a80 100%);
    border-radius:62% 38% 55% 45%;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.45), inset 0 -2px 4px rgba(140,40,70,.35);
    transition:transform .55s cubic-bezier(.5,.05,.4,1), opacity .45s ease;
  }
  .bow-l{left:3px; transform:rotate(-24deg);}
  .bow-r{right:3px; transform:rotate(24deg);}
  .bow-knot{
    position:absolute; left:50%; top:8px; width:27px; height:24px; margin-left:-13.5px;
    background:linear-gradient(160deg,#f9c3d3 0%, #ec7fa0 55%, #d4587e 100%);
    border-radius:45% 45% 55% 55%;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.5), 0 2px 5px rgba(120,30,55,.35);
    z-index:2;
    transition:transform .45s ease, opacity .45s ease;
  }
  .bow-tail-l,.bow-tail-r{
    position:absolute; top:22px; width:20px; height:32px;
    background:linear-gradient(180deg,#ea8fab,#d4587e);
    clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.3);
    transition:transform .6s cubic-bezier(.5,.05,.4,1), opacity .5s ease;
  }
  .bow-tail-l{left:12px; transform:rotate(10deg);}
  .bow-tail-r{right:12px; transform:rotate(-10deg);}
  /* 解开动画 */
  .bow.break .bow-l{transform:translateX(-48px) rotate(-75deg); opacity:0;}
  .bow.break .bow-r{transform:translateX(48px) rotate(75deg); opacity:0;}
  .bow.break .bow-knot{transform:scale(.2); opacity:0;}
  .bow.break .bow-tail-l{transform:translateX(-12px) rotate(45deg); opacity:0;}
  .bow.break .bow-tail-r{transform:translateX(12px) rotate(-45deg); opacity:0;}
  /* 启封按钮 */
  .open-btn{
    position:relative; z-index:5; margin-top:5.5vh;
    padding:13px 42px; border:none; cursor:pointer;
    border-radius:99px;
    background:linear-gradient(135deg,#ff8a9a,#e0486a);
    color:#fff; font-size:17px; letter-spacing:.5em; text-indent:.5em; font-weight:600;
    box-shadow:0 10px 26px rgba(224,72,106,.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .2s ease, box-shadow .2s ease, opacity .5s ease;
    font-family:inherit;
  }
  .open-btn:hover{transform:translateY(-2px) scale(1.04); box-shadow:0 14px 34px rgba(224,72,106,.55);}
  .open-btn:active{transform:scale(.97);}
  .open-btn.hide{opacity:0; pointer-events:none; transform:translateY(6px);}
  /* 粒子爆发 */
  .burst{
    position:fixed; inset:0; z-index:8; pointer-events:none; display:none;
  }
  .burst.go{display:block;}
  .p{
    position:absolute; left:50%; top:52%;
    font-size:20px; opacity:0;
    animation:fly 1.6s cubic-bezier(.16,.75,.3,1) forwards;
  }
  @keyframes fly{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(0deg);}
    12%{opacity:1;}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));}
  }
  /* 再看一次 */
  .replay{
    position:relative; z-index:6; margin-top:4.5vh;
    padding:9px 28px; border-radius:99px; cursor:pointer;
    background:transparent; border:1px solid rgba(243,217,164,.55);
    color:#f3d9a4; font-size:14px; letter-spacing:.3em; text-indent:.3em;
    font-family:inherit;
    transition:.25s;
  }
  .replay:hover{background:rgba(243,217,164,.12);}
  @media (max-width:600px){
    .bow{width:62px; height:34px; margin-left:-31px;}
    .bow-l,.bow-r{width:28px; height:21px;}
    .bow-knot{width:22px; height:20px; margin-left:-11px;}
    .bow-tail-l,.bow-tail-r{width:16px; height:26px;}
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="intro" id="intro"></div>

<div class="title">七 夕</div>

<div class="stage">
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="env-side left"></div>
    <div class="env-side right"></div>
    <div class="flap" id="flap"></div>
    <div class="bow" id="bow"><div class="bow-l"></div><div class="bow-r"></div><div class="bow-knot"></div><div class="bow-tail-l"></div><div class="bow-tail-r"></div></div>
  </div>
  <button class="open-btn" id="openBtn">启 封</button>
  <button class="replay" id="replay" style="display:none;">✨ 再看一次</button>
</div>

<div class="burst" id="burst"></div>

    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*92}%;width:${size}px;height:${size}px;animation-delay:${(Math.random()*3).toFixed(2)}s;`;
    sky.appendChild(s);
  }
  const emojis = ['❤','🌸','💕'];
  for(let i=0;i<9;i++){
    const h = document.createElement('div');
    h.className = 'fall-heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const dur = (Math.random()*7+9).toFixed(1);
    h.style.cssText = `left:${(Math.random()*96).toFixed(1)}%;font-size:${(Math.random()*12+12).toFixed(0)}px;animation-duration:${dur}s;animation-delay:${(Math.random()*10).toFixed(1)}s;`;
    sky.appendChild(h);
  }
})();

/* ---------- 启封流程 ---------- */
const envelope = document.getElementById('envelope');
const flap = document.getElementById('flap');
const bow = document.getElementById('bow');
const photo = document.getElementById('photo');
const openBtn = document.getElementById('openBtn');
const replayBtn = document.getElementById('replay');
const burst = document.getElementById('burst');

function startOpen(){
  openBtn.classList.add('hide');
  bow.classList.add('break');
  setTimeout(()=>flap.classList.add('open'), 380);   // 印章碎后翻开封口
  setTimeout(()=>photo.classList.add('show'), 1200); // 封口打开后照片从信封口飞出
  setTimeout(()=>envelope.classList.add('gone'), 1750); // 信封退场（照片已脱离，不受影响）
  setTimeout(()=>{ replayBtn.style.display = 'inline-block'; }, 2300);
  setTimeout(burstHearts, 1900); // 照片亮相时粒子绽放
}

/* 照片初始定位在信封口（fixed 坐标） */
function placePhoto(){
  const r = envelope.getBoundingClientRect();
  photo.style.left = (r.left + r.width/2) + 'px';
  photo.style.top = (r.top + r.height*0.27) + 'px';
}

function burstHearts(){
  burst.classList.add('go');
  burst.innerHTML = '';
  const emojis = ['❤','💖','✨','🌸','💕'];
  for(let i=0;i<26;i++){
    const p = document.createElement('span');
    p.className = 'p';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const ang = Math.random()*Math.PI*2;
    const dist = Math.random()*220+90;
    p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist*0.7 - 60 + 'px');
    p.style.setProperty('--rot', (Math.random()*280-140) + 'deg');
    p.style.fontSize = (Math.random()*16+14) + 'px';
    p.style.animationDelay = (Math.random()*0.35) + 's';
    burst.appendChild(p);
  }
  setTimeout(()=>burst.classList.remove('go'), 3000);
}

function reset(){
  envelope.classList.remove('gone');
  flap.classList.remove('open');
  bow.classList.remove('break');
  photo.classList.remove('show');
  openBtn.classList.remove('hide');
  replayBtn.style.display = 'none';
  burst.classList.remove('go');
  placePhoto();
}

/* ---------- 开场流星雨 ---------- */
function meteorShower(){
  const intro = document.getElementById('intro');
  const total = 16;
  for(let i=0;i<total;i++){
    const m = document.createElement('div');
    m.className = 'meteor';
    const top = (Math.random()*55).toFixed(1);
    const delay = (Math.random()*3.4).toFixed(2);
    const dur = (Math.random()*0.9+0.9).toFixed(2);
    const ang = (Math.random()*16+28).toFixed(1);
    const w = (Math.random()*100+130).toFixed(0);
    m.style.top = top + 'vh';
    m.style.width = w + 'px';
    m.style.setProperty('--ang', ang + 'deg');
    m.style.animationDelay = delay + 's';
    m.style.animationDuration = dur + 's';
    intro.appendChild(m);
  }
  setTimeout(()=>{
    intro.classList.add('fade');
    document.body.classList.add('ready');
    setTimeout(()=>{ intro.style.display = 'none'; }, 1200);
  }, 4400);
}

openBtn.addEventListener('click', startOpen);
replayBtn.addEventListener('click', reset);
placePhoto();
window.addEventListener('resize', ()=>{
  if(!photo.classList.contains('show')) placePhoto();
});
meteorShower();
</script>
